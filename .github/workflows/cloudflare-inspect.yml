name: Inspect Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cloudflare-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect deployment without changing Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          token = os.environ.get("CF_TOKEN", "")
          if not token:
              raise SystemExit("CLOUDFLARE_API_TOKEN secret is missing")
          def get(path):
              request = urllib.request.Request("https://api.cloudflare.com/client/v4"+path, headers={"Authorization":"Bearer "+token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as e:
                  raise SystemExit("Cloudflare API request failed: HTTP "+str(e.code))
              if not data.get("success"):
                  raise SystemExit("Cloudflare rejected request; codes: "+str([x.get("code") for x in data.get("errors",[])]))
              return data.get("result")
          print("Token status:", get("/user/tokens/verify").get("status"))
          account = os.environ.get("CF_ACCOUNT", "")
          if account:
              accounts = [{"id":account}]
          else:
              accounts = get("/accounts")
          for a in accounts:
              projects = get("/accounts/"+a["id"]+"/pages/projects")
              for p in projects:
                  print("Project:", json.dumps({"name":p.get("name"),"subdomain":p.get("subdomain"),"domains":p.get("domains"),"build_config":p.get("build_config"),"source":{k:p.get("source",{}).get("config",{}).get(k) for k in ["owner","repo_name","production_branch","deployments_enabled"]}}))
                  if p.get("name") != "hamriq":
                      continue
                  deployments = get("/accounts/"+a["id"]+"/pages/projects/hamriq/deployments")
                  for d in deployments[:5]:
                      print("Deployment:",json.dumps({k:d.get(k) for k in ["id","url","environment","created_on","latest_stage","deployment_trigger"]}))
                  domains = get("/accounts/"+a["id"]+"/pages/projects/hamriq/domains")
                  for d in domains:
                      print("Domain:", json.dumps({k:d.get(k) for k in ["name","status","validation_data","verification_data"]}))
          PY
