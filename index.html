<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="styles.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/mobile-consolidated-flows.css?v=20261002-loader-sanity-v1" />

  <link rel="stylesheet" href="src/workspace/final-operations-finish.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/inspection-photo-finish.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/approved-features-completion.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/approved-functionality-pack.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/approved-remaining-pack.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/provider-adapters.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/estimate-supplement-priority.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/estimate-supplement-engine.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/field-sales-intelligence.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/customer-ops-intelligence.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/lost-feature-recovery.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/fire-urgency.css?v=20261002-loader-sanity-v1" />
  <link rel="stylesheet" href="src/workspace/completion-polish.css?v=20261002-loader-sanity-v1" />
</head>
<body>
  <div id="app"></div>
  <script>
    const HAMRIQ_BUILD_VERSION = '20261002-loader-sanity-v1';
    const host = location.hostname.toLowerCase();
    function showLoadIssue(path) {
      const box = document.getElementById('hamriqLoadIssues') || (() => {
        const el = document.createElement('div');
        el.id = 'hamriqLoadIssues';
        el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#7f1d1d;color:white;border:1px solid #fecaca;border-radius:14px;padding:12px;font:13px/1.35 system-ui, sans-serif;box-shadow:0 18px 50px rgba(0,0,0,.35)';
        el.innerHTML = '<strong>HAMRIQ load warning</strong><div id="hamriqLoadIssueList" style="margin-top:6px"></div>';
        document.body.appendChild(el);
        return el;
      })();
      const list = box.querySelector('#hamriqLoadIssueList');
      const item = document.createElement('div');
      item.textContent = `Could not load: ${path}`;
      list.appendChild(item);
    }
    if (host === 'hamriq.com' || host === 'www.hamriq.com') {
      location.replace('/landing.html');
    } else {
      const load = path => {
        const s = document.createElement('script');
        s.type = 'module';
        s.src = `${path}?v=${HAMRIQ_BUILD_VERSION}`;
        s.onerror = () => showLoadIssue(path);
        document.body.appendChild(s);
      };
      load('app.js');
      load('src/workspace/mobile-consolidated-flows.mjs');
      load('src/workspace/hammy-action-layer.mjs');
      load('src/workspace/final-workflow-batch.mjs');
      load('src/workspace/final-operations-finish.mjs');
      load('src/workspace/inspection-photo-finish.mjs');
      load('src/workspace/approved-features-completion.mjs');
      load('src/workspace/approved-functionality-pack.mjs');
      load('src/workspace/approved-remaining-pack.mjs');
      load('src/workspace/provider-adapters.mjs');
      load('src/workspace/estimate-supplement-priority.mjs');
      load('src/workspace/estimate-supplement-engine.mjs');
      load('src/workspace/field-sales-intelligence.mjs');
      load('src/workspace/customer-ops-intelligence.mjs');
      load('src/workspace/lost-feature-recovery.mjs');
      load('src/workspace/fire-urgency.mjs');
      load('src/workspace/completion-polish.mjs');
    }
  </script>
</body>
</html>
