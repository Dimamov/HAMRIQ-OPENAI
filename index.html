<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>HAMRIQ</title>
  <script>
    const host = location.hostname.toLowerCase();
    const isDevLive = host === 'dev.hamriq.app' || new URLSearchParams(location.search).has('devlive');
    const devStamp = isDevLive ? String(Date.now()) : '20261001-hammy-actions-v2';
    const repoRaw = 'https://raw.githubusercontent.com/Dimamov/HAMRIQ-OPENAI/main/';
    const assetBase = isDevLive ? repoRaw : '';

    function loadCss(path) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `${assetBase}${path}?v=${devStamp}`;
      document.head.appendChild(link);
    }

    loadCss('styles.css');
    loadCss('src/workspace/mobile-consolidated-flows.css');
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    if (host === 'hamriq.com' || host === 'www.hamriq.com') {
      location.replace('/landing.html');
    } else {
      const appBase = isDevLive ? repoRaw : '';
      const scriptVersion = isDevLive ? String(Date.now()) : '20261001-hammy-actions-v2';

      function loadModule(path) {
        const script = document.createElement('script');
        script.type = 'module';
        script.src = `${appBase}${path}?v=${scriptVersion}`;
        document.body.appendChild(script);
      }

      loadModule('app.js');
      loadModule('src/workspace/mobile-consolidated-flows.mjs');
      loadModule('src/workspace/hammy-action-layer.mjs');
    }
  </script>
</body>
</html>
