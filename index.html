<body>
  <div id="app"></div>

    const host = location.hostname.toLowerCase();
    if (host === 'hamriq.com' || host === 'www.hamriq.com') {
      location.replace('/landing.html');
    } else {
      const load = path => {
        const s = document.createElement('script');
        s.type = 'module';
        s.src = `${path}?v=20261002-provider-completion-v1`;
        document.body.appendChild(s);
      };
      load('app.js');
      load('src/workspace/mobile-consolidated-flows.mjs');
      load('src/workspace/hammy-action-layer.mjs');
      load('src/workspace/final-workflow-batch.mjs');
